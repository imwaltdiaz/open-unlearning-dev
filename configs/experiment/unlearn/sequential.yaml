# @package _global_

defaults:
  - override /model: Qwen2.5-1.5B-Instruct
  - override /trainer: WGA
  - override /collator: DataCollatorForUnlearning
  - override /eval: tofu
  - override /data: unlearn
  - _self_

mode: unlearn
task_name: WGA_batch_1
forget_split: forget_batch_1
retain_path: data/historia/processed/retain.jsonl

model:
  adapter_path: ./saves/train/historia_M0

trainer:
  method_args:
    beta: 1.0
    gamma: 1.0
    alpha: 1.0
  args:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 1e-5
    num_train_epochs: 3
    lr_scheduler_type: constant
    remove_unused_columns: False