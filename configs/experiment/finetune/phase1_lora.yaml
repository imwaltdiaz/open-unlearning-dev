# @package _global_
# Configuración Fase 1 - Fine-tuning LoRA con Hydra

defaults:
  - override /model: TinyLlama-1.1B-Chat-v1.0
  - override /trainer: finetune
  - override /data: finetune
  - override /paths: default

# Parámetros específicos Fase 1
domain: ??? # Requerido: historia, matematica o literatura
max_train: 0 # 0 = usar todo dataset
max_eval: 0 # 0 = usar todo dataset
max_length: 1024
batch_size: 2
logging_steps: 10
mode: train

# Sobrescribir configuración de trainer para Fase 1
trainer:
  args:
    num_train_epochs: 1.0
    gradient_accumulation_steps: 1
    learning_rate: 1e-5
    per_device_train_batch_size: ${batch_size}
    per_device_eval_batch_size: ${batch_size}
    logging_steps: ${logging_steps}
    eval_strategy: "steps"
    eval_steps: ${logging_steps}
    save_steps: 50
    save_total_limit: 2
    remove_unused_columns: true
    report_to: []
    seed: 42  # Determinismo garantizado

task_name: ??? # Requerido: nombre del experimento
