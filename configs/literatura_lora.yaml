seed: 42
output_dir: runs/literatura_tinyllama_lora
model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
data:
  retain: data/literatura/processed/retain_expanded.jsonl
  forget: data/literatura/processed/forget_expanded.jsonl
  neighbor: data/literatura/processed/neighbor_expanded.jsonl
  max_length: 768
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]
train:
  epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200
