# @package _global_

defaults:
  - _self_
  - model: Llama-3.2-1B-Instruct
  - trainer: finetune
  - collator: DataCollatorForSupervisedDataset
  - paths: default
  - hydra: default

mode: train
task_name: ???
domain: historia

data:
  train:
    HISTORIA_full:
      handler: QADataset
      args:
        hf_args:
          path: json
          data_files: data/historia/processed/full.jsonl
          split: train
        question_key: question
        answer_key: answer
        max_length: 512
  eval:
    HISTORIA_neighbor:
      handler: QADataset
      args:
        hf_args:
          path: json
          data_files: data/historia/processed/neighbor.jsonl
          split: train
        question_key: question
        answer_key: answer
        max_length: 512

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

trainer:
  args:
    num_train_epochs: 1.0
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    eval_strategy: steps
    eval_steps: 50
    logging_steps: 10
    save_strategy: steps
    save_steps: 200
    save_total_limit: 2
    report_to: []
    seed: 42
